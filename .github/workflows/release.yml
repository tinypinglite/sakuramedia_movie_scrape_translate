name: Release Plugin
run-name: Release ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Validate tag and manifest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest['version'] == os.environ['TAG'][1:], 'Tag/manifest version mismatch'
          assert manifest['plugin_id'] == 'sakuramedia_movie_scrape_translate'
          PY

      - name: Build plugin ZIP
        run: python tools/package_plugin.py

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/sakuramedia_movie_scrape_translate-${TAG#v}.zip"
